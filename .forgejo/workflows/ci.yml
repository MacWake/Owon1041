name: Build and release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing tag to retry a partially published release
        required: false
        type: string

jobs:
  plan:
    runs-on: docker
    container: node:24-bookworm
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Test release versioning
        run: node --test scripts/release.test.mjs
      - name: Calculate version
        id: version
        env:
          RETRY_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release.mjs plan

  linux:
    needs: plan
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: ubuntu22
            image: ghcr.io/catthehacker/ubuntu:act-22.04
          - distro: debian-trixie
            image: node:24-trixie
    container: ${{ matrix.image }}
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config curl ca-certificates \
            libgtk-3-dev libgl1-mesa-dev
      - name: Configure and build
        env:
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "-DAPP_VERSION=$APP_VERSION"
          cmake --build build --parallel 2
      - name: Package DEB
        env:
          APP_VERSION: ${{ needs.plan.outputs.version }}
          DISTRO: ${{ matrix.distro }}
        run: |
          cd build
          cpack -G DEB
          mkdir -p ../dist
          packages=( *.deb )
          test "${#packages[@]}" -eq 1
          mv "${packages[0]}" "../dist/Owon1041-${APP_VERSION}-${DISTRO}.deb"
        shell: bash
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: package-${{ matrix.distro }}
          path: dist/*.deb
          if-no-files-found: error

  macos:
    needs: plan
    runs-on: macos-amd64
    steps:
      - name: Expose Homebrew tools to actions
        shell: bash
        run: |
          for prefix in /opt/homebrew/bin /usr/local/bin; do
            if [[ -x "$prefix/node" ]]; then
              printf '%s\n' "$prefix" >> "$GITHUB_PATH"
            fi
          done
      - uses: https://data.forgejo.org/actions/checkout@v6
      - name: Import signing certificate
        if: forgejo.ref == 'refs/heads/main'
        uses: https://github.com/Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.MACOS_CERT_P12 }}
          p12-password: ${{ secrets.MACOS_CERT_PASSWORD }}
          keychain-password: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      - name: Configure and build
        env:
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          cmake -S . -B build -G 'Unix Makefiles' -DCMAKE_BUILD_TYPE=Release \
            "-DAPP_VERSION=$APP_VERSION" '-DCMAKE_OSX_ARCHITECTURES=x86_64;arm64'
          cmake --build build --parallel 2
      - name: Sign app bundle
        shell: bash
        env:
          APPLE_SIGNING_ID: ${{ vars.APPLE_SIGNING_ID }}
          SIGN_RELEASE: ${{ forgejo.ref == 'refs/heads/main' }}
        run: |
          app="build/Owon1041.app"
          if [[ -d build/owon1041.app && ! -d "$app" ]]; then
            mv build/owon1041.app "$app"
          fi
          if [[ "$SIGN_RELEASE" == true ]]; then
            test -n "$APPLE_SIGNING_ID"
            codesign --deep --force --options runtime \
              --sign "Developer ID Application: $APPLE_SIGNING_ID" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          fi
      - name: Notarize signed app
        if: forgejo.ref == 'refs/heads/main'
        shell: bash
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          test -n "$NOTARY_APP_PASSWORD"
          test -n "$NOTARY_TEAM_ID"
          ditto -c -k --keepParent build/Owon1041.app build/Owon1041.zip
          status="$(xcrun notarytool submit build/Owon1041.zip \
            --apple-id "$NOTARY_APPLE_ID" --password "$NOTARY_APP_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" --wait --output-format json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')"
          test "$status" = Accepted
          xcrun stapler staple build/Owon1041.app
          xcrun stapler validate build/Owon1041.app
      - name: Package DMG
        env:
          APP_VERSION: ${{ needs.plan.outputs.version }}
        run: |
          lipo build/Owon1041.app/Contents/MacOS/Owon1041 -verify_arch x86_64 arm64
          mkdir -p dist
          hdiutil create -volname Owon1041 -srcfolder build/Owon1041.app \
            -ov -format UDZO "dist/Owon1041-${APP_VERSION}-macos-universal.dmg"
      - uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: package-macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    needs: [plan, linux, macos]
    if: forgejo.ref == 'refs/heads/main' && needs.plan.outputs.release == 'true'
    runs-on: docker
    container: node:24-bookworm
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          pattern: package-*
          path: dist/release
          merge-multiple: true
      - name: Publish Forgejo and GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          APPLE_SIGNING_ID: ${{ vars.APPLE_SIGNING_ID }}
          GITHUB_REPOSITORY: macwake/Owon1041
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RETRY_RELEASE_TAG: ${{ inputs.release_tag }}
        run: node scripts/release.mjs publish
